name: tracive_sdk_example
description: >-
  A runnable example for package:tracive_sdk. It talks to an in-process fake
  backend, because the Tracive Open API is not live yet.

# Never published: it exists to be read and run, not depended on.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # The SDK under demonstration, by path — so running this example always
  # exercises the working tree, never a published version that may differ.
  tracive_sdk:
    path: ../

  cupertino_icons: ^1.0.8

  # Delivers the OAuth redirect to Dart in the sandbox and production flavors,
  # including the one that cold-starts the app. Any deep-link package works;
  # the SDK only needs the Uri (doc/oauth.md).
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # `flutter run` with no --flavor. The demo needs no credentials and no
  # network, so a fresh clone still runs. See lib/flavor.dart.
  default-flavor: demo
