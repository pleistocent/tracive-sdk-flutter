# CI for the Tracive Flutter SDK.
#
# NO NETWORK IN TESTS. Nothing in this repo talks to a server, and nothing can:
# the Tracive Open API is not live yet, and every test injects a fake transport.
# So this workflow needs no secrets, no service containers and no environment —
# if a step here ever starts needing a credential, something has gone wrong.
#
# Runs on ubuntu-latest. A macOS runner is only needed where iOS is involved;
# the Flutter SDK's unit tests are pure Dart and its example builds for Android,
# so nothing here compiles Swift. The Swift SDK's own repo is where the macOS
# runner belongs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "stable". A floating channel means a Flutter release can turn
  # a green PR red with no change to this repo — and the formatter in
  # particular changes its output between versions.
  FLUTTER_VERSION: 3.29.3

jobs:
  package:
    name: Package — analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The vendored fixture is the anti-drift contract: the Kotlin, Flutter and
      # Swift SDKs must fold identical input to identical keys, and they only do
      # that if all three carry the *same* file. Verbatim means verbatim.
      #
      # If you are updating the grammar on purpose, change the fixture in every
      # SDK repo and update this checksum in each — that deliberate act is the
      # whole point of pinning it.
      - name: Verify the query-grammar fixture is unmodified
        run: |
          echo "f94bf48164c82bcc59fda30669d9d8c25dbc36ecc7ad93fcd7fb56ba2cdf2901  test/fixtures/query-grammar-vectors.json" \
            | sha256sum --check --strict

      # The phone-normalization fixture, pinned the same way and for the same
      # reason. Its expected values came from the Tracive app's own normalizer,
      # so it is the contract that keeps app and SDK folding one person to one
      # record key. It shipped on 2 August 2026 with no pin in any repository,
      # and an audit then found the four SDKs disagreeing on a digit joined to
      # a variation selector — the exact drift a pinned shared fixture exists
      # to make impossible.
      - name: Verify the phone-normalization fixture is unmodified
        run: |
          echo "4e9d8015e1368451f1d5e6edd8248c15fa89f071ad3a608095978460112f19b0  test/fixtures/phone-normalization-vectors.json" \
            | sha256sum --check --strict

      # Deliberately not `--set-exit-if-changed` on a subset: a published
      # package is formatted or it is not. If this fails, run `dart format .`
      # at the repo root and commit the result.
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed . \
            || { echo "::error::Unformatted Dart. Fix with: dart format . "; exit 1; }

      # `analysis_options.yaml` turns unawaited_futures into an error and
      # requires docs on every public member, so this is a real gate, not a
      # style suggestion. Warnings fail it too.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  example:
    name: Example — analyze, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The example builds a real Android APK, which needs a JDK. Flutter 3.29
      # targets AGP 8.x, which wants Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # There is deliberately no `flutter create` step here any more.
      # `example/android/` is tracked, so this job builds the same project a
      # reviewer can read. Regenerating it built a project nobody had seen and
      # threw away the settings the build depends on — see `.gitignore`.
      # The Gradle wrapper, `local.properties` and the generated plugin
      # registrant are still absent from the repo on purpose; the Flutter tool
      # writes them itself on first build.
      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze
        working-directory: example
        run: flutter analyze --fatal-infos --fatal-warnings

      # Widget tests over the fake backend: they assert that a cache hit does
      # no network I/O and that the disclaimer is on screen.
      - name: Test
        working-directory: example
        run: flutter test --reporter expanded

      # The build half of "build + unit tests": it proves the SDK's plugin
      # dependencies (sqflite_sqlcipher, flutter_secure_storage, url_launcher)
      # actually link on a real target, which no unit test can. Because the
      # platform folder is tracked, it also proves the `<queries>` element the
      # OAuth app-presence probe needs survives manifest merging.
      - name: Build Android APK (debug)
        working-directory: example
        run: flutter build apk --debug
