name: tracive_sdk_extended
description: >-
  Lets a user report a scammer from inside your app, on Tracive's native form
  or your own Flutter UI, and check that report's status.
version: 0.2.2
homepage: https://github.com/pleistocent/tracive-sdk-flutter/tree/main/extended
repository: https://github.com/pleistocent/tracive-sdk-flutter/tree/main/extended
issue_tracker: https://github.com/pleistocent/tracive-sdk-flutter/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  tracive_sdk: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: id.tracive.sdk.extended.flutter
        pluginClass: TraciveSdkExtendedPlugin
      ios:
        pluginClass: TraciveSdkExtendedPlugin
